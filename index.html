    <script>
      (function() {
        // Defensive fix for fetch
        try {
          var originalFetch = window.fetch;
          var _fetch = originalFetch;
          try {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() { return _fetch; },
              set: function(v) { _fetch = v; }
            });
          } catch (e1) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function() { return _fetch; },
                set: function(v) { _fetch = v; }
              });
            } catch (e2) {}
          }
        } catch (err) {}

        // Global safety net for Vite websocket or unhandled transport errors
        function shouldSuppress(msg) {
          if (!msg || typeof msg !== 'string') return false;
          return msg.indexOf('reading \'send\'') !== -1 ||
                 msg.indexOf('failed to connect to websocket') !== -1 ||
                 msg.indexOf('fetch of #<Window>') !== -1;
        }

        window.addEventListener('error', function(event) {
          var msg = event && (event.message || (event.error && event.error.message));
          if (shouldSuppress(msg)) {
            event.preventDefault();
            event.stopPropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = reason && (reason.message || String(reason));
          if (shouldSuppress(msg)) {
            event.preventDefault();
            event.stopPropagation();
            return true;
          }
        }, true);
      })();
    </script>
